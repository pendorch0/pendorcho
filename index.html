<title>Diario Visual</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#ddd;
    font-family:Georgia, serif;
    padding:60px;
    max-width:1000px;
    margin:auto;
}

.hero{
    height:30vh;
    background-image:url('foto1.jpg');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    display:flex;
    align-items:flex-end;
    padding:60px;
}

.hero-content{
    max-width:600px;
}

nav{
    display:flex;
    justify-content:space-between;
    margin-bottom:40px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
}

nav a:hover{
    opacity:.5;
}
    
h1{
    font-size:3rem;
    font-weight:normal;
    margin-bottom:120px;
}

.anio{
    font-size:2rem;
    margin-bottom:60px;
    color:#999;
}

.mes{
    font-size:1.2rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-top:60px;
    margin-bottom:25px;
    color:#888;
}

.serie{
    display:block;
    color:#ddd;
    text-decoration:none;
    font-size:1.8rem;
    margin-bottom:12px;
}

.serie:hover{
    opacity:.6;
}

.info{
    color:#666;
    margin-bottom:40px;
    font-size:14px;
}

.cabecera{
    text-align:center;
    margin-bottom:40px;
}

.cabecera img{
    max-width:100%;
    max-height:65vh;
    width:auto;
    height:auto;
    display:inline-block;
}
    
footer{
    margin-top:150px;
    color:#555;
    font-size:14px;
}

</style>

</head>
