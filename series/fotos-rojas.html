<style>

*{

    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#ddd;

}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:25px 40px;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:space-between;
    z-index:1000;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
}

nav a:hover{
    opacity:.6;
}

.cabecera{
    padding-top:140px;
    padding-bottom:120px;
    text-align:center;
}

.titulo{
    font-size:4rem;
    font-weight:normal;
    margin-bottom:20px;
}

.fecha{
    color:#777;
    letter-spacing:3px;
    text-transform:uppercase;
}

.intro{
    max-width:700px;
    margin:0 auto;
    padding:0 30px 120px 30px;
    text-align:center;
    line-height:1.8;
    color:#999;
}

.foto{
    text-align:center;
    margin-bottom:120px;
}

.foto img{
    max-width:95vw;
    max-height:95vh;
    width:auto;
    height:auto;
    display:inline-block;
}

.texto{
    max-width:700px;
    margin:100px auto;
    padding:0 30px;
    line-height:1.9;
    color:#aaa;
}

.footer-nav{
    display:flex;
    justify-content:center;
    gap:60px;
    padding:120px 30px;
}

.footer-nav a{
    color:#777;
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:13px;
}

.footer-nav a:hover{
    color:#ddd;
}

</style>

</head>
